# COPY this file, fill in real values, apply, then DELETE the copy.
# Never commit filled-in secrets.
apiVersion: v1
kind: Secret
metadata:
  name: argus-secrets
  namespace: argus
type: Opaque
stringData:
  # Control plane (GCP; AWS executors reach these over VPC peering)
  VK_PG_DSN: "postgresql://vk:CHANGE_ME@10.x.y.z:5432/vishwakarma"
  VK_REDIS_URL: "redis://10.x.y.w:6379/0"

  # LLM gateway — one key per executor pool recommended (429 limit is per key)
  VK_API_KEY: "sk-CHANGE_ME"

  # Sage (existing chat bot)
  SLACK_BOT_TOKEN: "xoxb-CHANGE_ME"
  SLACK_APP_TOKEN: "xapp-CHANGE_ME"

  # Argus (RCA bot — second Slack app)
  ARGUS_BOT_TOKEN: "xoxb-CHANGE_ME"
  ARGUS_APP_TOKEN: "xapp-CHANGE_ME"
  ARGUS_MRE_GROUP_ID: "S030UXXXXXX"

  # Optional: embeddings provider (semantic RAG; keyword-only without it)
  VK_EMBEDDINGS_API_BASE: ""
  VK_EMBEDDINGS_API_KEY: ""
  VK_EMBEDDINGS_MODEL: ""
