# COPY this file, fill in real values, apply, then DELETE the copy.
# Never commit filled-in secrets.
apiVersion: v1
kind: Secret
metadata:
  name: argus-secrets
  namespace: argus
type: Opaque
stringData:
  # Control-plane Postgres — the IN-CLUSTER pod (postgres.yaml). Password must
  # match argus-postgres Secret's POSTGRES_PASSWORD.
  VK_PG_DSN: "postgresql://argus:CHANGE_ME_strong_password@argus-postgres.argus.svc.cluster.local:5432/argus"

  # No Redis in all-in-one — leave EMPTY (in-memory dedup/events/correlation).
  VK_REDIS_URL: ""

  # LLM gateway KEY POOL — comma-separated. The pool round-robins + backs off
  # on 429 (per-key limit). Use as many keys as you provisioned.
  VK_API_KEYS: "sk-KEY1,sk-KEY2,sk-KEY3"
  # Single-key fallback (also used by OpenCode/code_session via the gateway).
  VK_API_KEY: "sk-CHANGE_ME"
  VK_GATEWAY_KEY: "sk-CHANGE_ME"        # OpenCode reads this for the gateway provider

  # Sage (chat bot) — Socket Mode
  SLACK_BOT_TOKEN: "xoxb-CHANGE_ME"
  SLACK_APP_TOKEN: "xapp-CHANGE_ME"
  SLACK_CHANNEL: "#sage-test"        # switch to the real channel after shadow

  # Argus (RCA bot — second Slack app, @mre trigger). Needs an xapp- app-level
  # token (App-Level Tokens -> connections:write) for Socket Mode.
  ARGUS_BOT_TOKEN: "xoxb-CHANGE_ME"
  ARGUS_APP_TOKEN: "xapp-CHANGE_ME"
  ARGUS_MRE_GROUP_ID: "S030UXXXXXX"

  # GitHub App / PAT token — enables the draft-PR fix path. Needs repo (clone
  # private + push branch) + pull-request scope on your-org/backend.
  GITHUB_TOKEN: "ghp_CHANGE_ME"

  # Embeddings are local (config embeddings.provider=local) — these stay empty.
  VK_EMBEDDINGS_API_BASE: ""
  VK_EMBEDDINGS_API_KEY: ""
  VK_EMBEDDINGS_MODEL: ""
