# Orchestrator — exactly ONE replica (owns the Slack Socket Mode connections
# and the webhook). Runs in the control-plane cloud (GCP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-orchestrator
  namespace: argus
  labels: { app: argus-orchestrator }
spec:
  replicas: 1
  strategy:
    type: Recreate          # never two orchestrators (Slack socket + reaper)
  selector:
    matchLabels: { app: argus-orchestrator }
  template:
    metadata:
      labels: { app: argus-orchestrator }
    spec:
      containers:
        - name: orchestrator
          image: CHANGE_ME/vishwakarma:latest-argus
          command: ["vk", "serve-orchestrator", "--config", "/etc/argus/config.yaml"]
          ports:
            - containerPort: 5050
          envFrom:
            - secretRef: { name: argus-secrets }
          env:
            - name: VK_CONFIG
              value: /etc/argus/config.yaml
          volumeMounts:
            - { name: config, mountPath: /etc/argus }
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: 5050 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 5050 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        - name: config
          configMap: { name: argus-config }
        - name: data
          persistentVolumeClaim: { claimName: argus-orchestrator-data }
---
apiVersion: v1
kind: Service
metadata:
  name: argus-orchestrator
  namespace: argus
spec:
  selector: { app: argus-orchestrator }
  ports:
    - port: 80
      targetPort: 5050
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-orchestrator-data
  namespace: argus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }
