# Argus ALL-IN-ONE deployment (GCP-first start). One pod runs `vk serve`:
# webhook + both Slack bots + in-process investigations + the web console at
# /console. No Redis, no separate executors (those are the scaled topology in
# orchestrator.yaml / executor-*.yaml — use those only when you split out).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus
  namespace: argus
  labels: { app: argus }
spec:
  replicas: 1
  strategy:
    type: Recreate          # single pod owns the Slack Socket Mode connections
  selector:
    matchLabels: { app: argus }
  template:
    metadata:
      labels: { app: argus }
    spec:
      serviceAccountName: argus      # Workload Identity → read-only GCP SA + view RBAC
      containers:
        - name: argus
          image: asia-south1-docker.pkg.dev/prod-project/argus/vishwakarma:1.0.0-argus
          command: ["vk", "serve", "--config", "/etc/argus/config.yaml"]
          ports:
            - { name: http, containerPort: 5050 }
          envFrom:
            - secretRef: { name: argus-secrets }
          env:
            - name: VK_CONFIG
              value: /etc/argus/config.yaml
            - name: VK_LEARNINGS_PATH
              value: /data/learnings
            - name: VK_KNOWLEDGE_PATH
              value: /data/knowledge.md
          volumeMounts:
            - { name: config, mountPath: /etc/argus }
            - { name: data, mountPath: /data }       # learnings, knowledge, repo cache
          readinessProbe:
            httpGet: { path: /healthz, port: 5050 }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: 5050 }
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 1Gi }      # +~300MB for the bge-small model
            limits: { cpu: "2", memory: 4Gi }
      volumes:
        - name: config
          configMap: { name: argus-config }
        - name: data
          persistentVolumeClaim: { claimName: argus-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-data
  namespace: argus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    # /data holds: learnings + knowledge + the cloned repo cache (/data/repos)
    # + OpenCode edit worktrees + the code-RAG index. The example-app monorepo
    # (sparse-checkout of Backend) + worktrees needs real room.
    requests: { storage: 50Gi }
---
# ClusterIP — in-cluster + used by `kubectl port-forward` for the console.
apiVersion: v1
kind: Service
metadata:
  name: argus
  namespace: argus
  labels: { app: argus }
spec:
  selector: { app: argus }
  ports:
    - { name: http, port: 80, targetPort: 5050 }
# UI ACCESS — fronted by POMERIUM (identity-aware proxy, SSO at the edge).
# Pomerium routes an external hostname -> this ClusterIP Service
# (argus.argus.svc.cluster.local:80) and enforces auth, so ui.auth_disabled:true
# in the config is fine — Pomerium is the gate. Add a Pomerium route/Ingress:
#   from: https://argus.<your-domain>
#   to:   http://argus.argus.svc.cluster.local
#   policy: allow @example.com (or the relevant group)
# (For a quick check before Pomerium is wired: kubectl -n argus port-forward
#  svc/argus 8080:80 -> http://localhost:8080/console)
